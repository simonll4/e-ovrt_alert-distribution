[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eovrt-alert-distribution"
version = "0.1.0"
description = "E-OVRT-VDP alert distribution: decoupled consumer of confirmed alerts (spec 45)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.5",
    "pyzmq>=25",
    "msgpack>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
service = ["fastapi>=0.110", "uvicorn[standard]"]
# dev incluye el extra `service`: buena parte de la suite (test_service_api,
# test_service_live, test_run_manager, test_run_ids, test_cli_serve) ejercita el
# servicio HTTP (ADR-019) y necesita fastapi/uvicorn para siquiera importar.
# ✎ 2026-08-18: antes `dev` no lo arrastraba y la instalacion documentada en el
# README (`pip install -e ".[mqtt,dev]"`) dejaba ~40 tests sin poder importar.
dev = ["pytest>=8", "ruff>=0.4", "httpx", "eovrt-alert-distribution[service]"]

[project.scripts]
eovrt-distribute = "eovrt_distribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external services (MQTT broker)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
